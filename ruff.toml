# Ruff 配置（第 121 步 / 评价7 P1-1）
#
# ## 为什么只开这么窄的规则
#
# `select = ["E4", "E7", "E9", "F"]` 是 pyflakes + 语法级错误：
# **未定义名、未使用的导入/变量、f-string 占位符缺失、重复定义、坏语法**。
# 这一档的共同点是"几乎不可能有正当理由"，所以能直接当 CI 的红线。
#
# 刻意**不开**的（都试过或想过）：
# - `select = ["ALL"]`：这个项目里会一次冒出 3000+ 条（含 DTZ011/S110/BLE001 这类
#   需要逐条讨论的规则），结果只能靠忽略清单压下去 —— 那等于没有红线。
# - `ruff format --check`：会重排全部 60+ 个文件，历史里出现一个"纯格式化"的巨大
#   commit，之后 blame 全废。真要做应该单独一轮、单独讨论。
# - `mypy`：全量类型检查会变成长期债；把 `Any` 换成精确类型是另一个工程。
#
# 想加规则的话，一次加一条，先把现有代码修干净再加。

line-length = 100
target-version = "py313"

# 运行期生成 / 与本仓库无关的东西，别让它们污染统计。
# 注意：TOML 的段（[xxx]）会一直生效到下一个段，所以这个**必须**放在所有段之前。
exclude = [
    ".venv",
    ".testtmp",
    ".ptmp*",
    # 第 263 步：pytest 会在这里建 tmp_path，ACL 锁住读不了，
    # 不排除的话 `ruff check .` 每次都刷一条「拒绝访问 (os error 5)」并退 1。
    ".pytest_tmp*",
    "backups",
    "data",
    "set",
    "__pycache__",
    ".git",
]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# 脚本与测试里"先插入 sys.path 再 import 项目模块"是刻意的（E402）
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
